openapi: 3.0.3
info:
  title: Accounts API
  version: 1.0.0
  description: API for managing bank accounts
servers:
  - url: /api/accounts
paths:
  "/":
    get:
      summary: Get all accounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountDto"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  "/{id}":
    get:
      summary: Get account by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Account not found
    patch:
      summary: Update account by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountDto"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Account not found
    delete:
      summary: Delete account by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Account deleted
        "404":
          description: Account not found
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountNumber:
          type: string
        type:
          type: string
          enum:
            - AHO
            - CTE
        state:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateAccountDto:
      type: object
      properties:
        accountNumber:
          type: string
        type:
          type: string
          enum:
            - AHO
            - CTE
        state:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
      required:
        - type
        - state
    UpdateAccountDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - AHO
            - CTE
        state:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
      required:
        - type
        - state
